services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Vui lòng đặt SQL_PASSWORD trong .env}
      MSSQL_PID: Developer
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: src/CareLink.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Server=sqlserver;Database=CareLink;User Id=sa;Password=${SQL_PASSWORD};TrustServerCertificate=True
      Jwt__Key: ${JWT_KEY:?Vui lòng đặt JWT_KEY dài ít nhất 32 byte}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Vui lòng đặt ADMIN_PASSWORD}
      Cors__Origins__0: http://localhost:${WEB_PORT:-8080}
    depends_on:
      sqlserver:
        condition: service_healthy
    ports: ["${API_PORT:-5080}:8080"]
    volumes: ["uploads:/app/App_Data"]
    restart: unless-stopped
  web:
    build:
      context: web
    ports: ["${WEB_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped
volumes:
  sql-data:
  uploads:
